name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release Go Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.0"

      - name: Build binary
        run: |
          mkdir -p dist
          export LDFLAGS="-s -w"
          export GOFLAGS="-ldflags=$LDFLAGS"
          export CGO_ENABLED=0

          # Linux
          GOOS=linux GOARCH=amd64 go build -o dist/chai-linux ./cmd/chai/main.go
          upx --best dist/chai-linux

          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/chai-windows.exe ./cmd/chai/main.go
          upx --best dist/chai-windows.exe

          # macOS
          GOOS=darwin GOARCH=amd64 go build -o dist/chai-macos ./cmd/chai/main.go
          upx --best dist/chai-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/chai-linux
            dist/chai-windows.exe
            dist/chai-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
