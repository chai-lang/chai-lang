<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASM Go Example</title>
  <script src="./wasm_exec.js"></script>
  <script type="module">
    const go = new Go();

    const headers = new Headers();
    headers.append("Content-Type", "application/wasm");

    const wasm = await WebAssembly.instantiateStreaming(
      fetch("main.wasm", {headers}),
      go.importObject
    );

    await go.run(wasm.instance);

    console.log("Calling run")
    run(); // or globalThis.run()
  </script>
  <script>
    window.addEventListener("message", (event) => {
      if (event.data === "chai-lang:ready") {
        const data = run(`
dekh n hai 5;
dekh i hai 1;

jabtak (i <= n) tabtak {
  dekh line hai "";
  dekh space hai 1;
  jabtak (space <= n - i) tabtak {
    line hai line + " ";
    space hai space + 1;
  }

  dekh j hai 1;
  jabtak (j <= i) tabtak {
    line hai line + "* ";
    j hai j + 1;
  }

  bol line;
  i hai i + 1;
}
`);
        console.log(data)
      }
    })
  </script>
</head>

<body>
</body>

</html>
